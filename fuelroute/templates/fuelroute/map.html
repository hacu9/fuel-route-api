<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
         color: #10202e; background: #f4f6f8; }
  .wrap { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { overflow-y: auto; padding: 20px; background: #fff; border-right: 1px solid #dde3e9; }
  #map { height: 100vh; }
  h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: #63707d; font-size: 12px; margin-bottom: 18px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .kpi { background: #f0f4f8; border-radius: 8px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 11px; color: #63707d; text-transform: uppercase; letter-spacing: .04em; }
  .total { background: #0b6b3a; color: #fff; grid-column: 1 / -1; }
  .total span { color: #b9e2cb; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
       color: #63707d; margin: 20px 0 8px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { border: 1px solid #e2e8ee; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  li .nm { font-weight: 600; }
  li .meta { color: #63707d; font-size: 12px; }
  li .buy { margin-top: 6px; font-variant-numeric: tabular-nums; }
  .price { color: #0b6b3a; font-weight: 600; }
  .err { background: #fdecec; border: 1px solid #f5b5b5; padding: 12px; border-radius: 8px; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; height: auto; }
                              #map { height: 60vh; } }
</style>
<div class="wrap">
  <aside>
    {% if error %}<div class="err">Invalid request: <code>{{ error }}</code></div>{% endif %}
    <div id="panel"></div>
  </aside>
  <div id="map"></div>
</div>
<script id="plan" type="application/json">{{ plan_json|safe }}</script>
<script>
const plan = JSON.parse(document.getElementById('plan').textContent);
const money = n => '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

if (plan) {
  const fp = plan.fuel_plan, rt = plan.route;
  document.getElementById('panel').innerHTML = `
    <h1>${plan.start.query} &rarr; ${plan.finish.query}</h1>
    <div class="sub">Planned in ${plan.meta.elapsed_ms} ms using
      ${plan.meta.external_api_calls.total} external API call(s).</div>
    <div class="kpis">
      <div class="kpi"><b>${rt.distance_miles.toLocaleString()}</b><span>miles</span></div>
      <div class="kpi"><b>${rt.duration_hours.toFixed(1)} h</b><span>drive time</span></div>
      <div class="kpi"><b>${fp.stop_count}</b><span>fuel stops</span></div>
      <div class="kpi"><b>${fp.total_gallons_purchased.toFixed(1)}</b><span>gallons</span></div>
      <div class="kpi total"><b>${money(fp.total_cost_usd)}</b><span>total fuel cost</span></div>
    </div>
    <h2>Fuel stops</h2>
    <ol>${fp.stops.map((s, i) => `
      <li>
        <div class="nm">${i + 1}. ${s.name}</div>
        <div class="meta">${s.city}, ${s.state} &middot; mile ${s.route_mile_marker}
          &middot; ${s.detour_miles} mi off route</div>
        <div class="buy">${s.gallons_purchased.toFixed(1)} gal @
          <span class="price">$${s.price_per_gallon.toFixed(3)}</span>/gal =
          <b>${money(s.cost_usd)}</b></div>
      </li>`).join('')}
    </ol>`;

  const map = L.map('map');

  // Tile providers, tried in order. OpenStreetMap's own servers are volunteer
  // run and their usage policy requires an app to identify itself; a page on
  // localhost cannot, so they answer 403 "Access blocked" and the map fills
  // with warning tiles. CARTO and Esri are CDNs meant for this, need no API
  // key, and keep the OpenStreetMap attribution their data requires.
  // Tile providers, tried in order. Two traps here, both found by looking at
  // the rendered map rather than at the HTTP status:
  //   - OpenStreetMap's own servers are volunteer run and their usage policy
  //     requires an app to identify itself. A page on localhost cannot, so they
  //     answer 403 and the map fills with "Access blocked" tiles.
  //   - CARTO answers 200 and then watermarks every tile "API KEY REQUIRED".
  // Esri's basemap is open for this use and needs no key.
  const PROVIDERS = [
    { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      opts: { maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; source: Esri, HERE, Garmin, OpenStreetMap contributors' } },
    { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
      opts: { maxZoom: 19, attribution: 'Tiles &copy; Esri' } },
    { url: 'https://tile.openstreetmap.de/{z}/{x}/{y}.png',
      opts: { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' } },
  ];


  let providerIndex = 0;
  let tiles = null;

  function useProvider(index) {
    if (index >= PROVIDERS.length) return;   // out of options; keep the last
    if (tiles) map.removeLayer(tiles);
    providerIndex = index;
    const p = PROVIDERS[index];
    let failures = 0;
    tiles = L.tileLayer(p.url, p.opts);
    // A handful of failures means this provider is refusing us, not that one
    // tile is missing. Move on rather than paint the map with error tiles.
    tiles.on('tileerror', () => {
      if (++failures === 4 && providerIndex === index) useProvider(index + 1);
    });
    tiles.addTo(map);
  }
  useProvider(0);

  const line = L.geoJSON(rt.geojson, { style: { color: '#1b62c4', weight: 4, opacity: .85 } }).addTo(map);
  map.fitBounds(line.getBounds(), { padding: [30, 30] });

  const pin = (color, label) => L.divIcon({
    className: '', iconSize: [22, 22], iconAnchor: [11, 11],
    html: `<div style="width:22px;height:22px;border-radius:50%;background:${color};
      color:#fff;font:600 11px/22px system-ui;text-align:center;
      border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)">${label}</div>`
  });

  L.marker([plan.start.latitude, plan.start.longitude], { icon: pin('#10202e', 'A') })
    .addTo(map).bindPopup(`<b>Start</b><br>${plan.start.query}`);
  L.marker([plan.finish.latitude, plan.finish.longitude], { icon: pin('#10202e', 'B') })
    .addTo(map).bindPopup(`<b>Finish</b><br>${plan.finish.query}`);

  fp.stops.forEach((s, i) => {
    L.marker([s.latitude, s.longitude], { icon: pin('#0b6b3a', String(i + 1)) })
      .addTo(map)
      .bindPopup(`<b>${s.name}</b><br>${s.address || ''}<br>${s.city}, ${s.state}
        <br>mile ${s.route_mile_marker} &middot; $${s.price_per_gallon.toFixed(3)}/gal
        <br>${s.gallons_purchased.toFixed(1)} gal = ${money(s.cost_usd)}`);
  });
}
</script>
