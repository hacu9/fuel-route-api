[project]
name = "fuel-route-api"
version = "1.0.0"
description = "Route planner that picks the cheapest fuel stops along a US route."
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.18",
    "django-environ>=0.12",
    "requests>=2.32",
    "polyline>=2.0",
    "numpy>=2.1",
    "scipy>=1.14",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "responses>=0.25",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Django writes migrations; their formatting is not ours to police.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["fuelroute/tests"]
